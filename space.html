<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>3D Space</title>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <h1>1. Mouse Left to Orbit Drag</h1>
    <h2>2. Mouse Right to Drag</h2>
    <h3>3. Scroll to Zoom In/Out</h3>

    <div class="cube-information"></div>

    <a id="home">Home</a>

    <dialog id="messageBox">
      <label for="name">Name:</label>
      <input type="text" id="name">

      <label for="year">Year:</label>
      <input type="number" id="year" value="2025" min="1900" max="2099">

      <label for="message">Message:</label>
      <input type="text" id="message">

      <button id="submitBtn">Submit</button>
    </dialog>

    <script type="module" src="/main.js"></script>
  </body>
</html>
