<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Fly to a location based on scroll position</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

  <!-- Mapbox CSS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.17.0-beta.1/mapbox-gl.css" rel="stylesheet">

  <!-- Your custom CSS -->
  <style>
    /* Basic reset */
    body {
      margin: 0;
      padding: 0;
    }

    /* Map position */
    #map {
      position: fixed;
      top: 200px;
      bottom: 100px;
      right: 800px;
      width: 30%;

    }

    /* Right-side scroll content */
    #features {
      position: fixed;
      top: 200px;
      bottom: 100px;
      right: 350px;
      width: 30%;
      margin-left: 30%;
      font-family: sans-serif;
      overflow-y: scroll;
      background-color: #fafafa;
    }

    /* Section styling */
    section {
      padding: 25px 50px;
      line-height: 25px;
      border-bottom: 1px solid #ddd;
      font-size: 13px;
      cursor: pointer;
    }

    section:hover {
      background-color: #eee;
    }

    section:last-child {
      border-bottom: none;
      margin-bottom: 200px;
    }

    body {
      background-image: url("bg.png");
       background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    h1 {
      position: absolute;
      top: 100px;
      left: 500px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      font-size: 50px;;
      color: white;
    }
  </style>
</head>
<h1>IMA Global Artistic Space</h1>
<body>

<div id="map"></div>

<div id="features">
  <section id="New-York-City" onclick="navigate(1)">
    <h3>370 Jay Street.</h3>
    <p>...</p>
  </section>

  <section id="Berlin" onclick="navigate(2)">
    <h3>Schönhauser Allee 36</h3>
    <p>...</p>
  </section>

  <section id="Shanghai" onclick="navigate(3)">
    <h3>No. 567 West Yangsi West Road</h3>
    <p>...</p>
  </section>

</div>
<div></div>

<!-- Mapbox JS -->
<script src="https://api.mapbox.com/mapbox-gl-js/v3.17.0-beta.1/mapbox-gl.js"></script>

<!-- Your custom JS -->
<script>

  function navigate(id) {
    location.href = '/space.html?space=' + id
  }

  // Mapbox code
  mapboxgl.accessToken = 'pk.eyJ1IjoiamluZ3lpMTAxMyIsImEiOiJjbWhpbHJreDAwZTh5MmlvZHZhNm90anc2In0.YO3YGnq8Tl7NGO_XHC6s4w';
  const map = new mapboxgl.Map({
    container: 'map',
    // Choose from Mapbox's core styles, or make your own style with Mapbox Studio
    style: 'mapbox://styles/mapbox/standard',
    center: [-0.15591514, 51.51830379],
    zoom: 15.5,
    bearing: 27,
    pitch: 45
  });

  const chapters = {
    'baker': {
      bearing: 27,
      center: [-0.15591514, 51.51830379],
      zoom: 15.5,
      pitch: 20
    },
    'aldgate': {
      duration: 6000,
      center: [-0.07571203, 51.51424049],
      bearing: 150,
      zoom: 15,
      pitch: 0
    },
    'london-bridge': {
      bearing: 90,
      center: [-0.08533793, 51.50438536],
      zoom: 13,
      speed: 0.6,
      pitch: 40
    },
    'woolwich': {
      bearing: 90,
      center: [0.05991101, 51.48752939],
      zoom: 12.3
    },
    'gloucester': {
      bearing: 45,
      center: [-0.18335806, 51.49439521],
      zoom: 15.3,
      pitch: 20,
      speed: 0.5
    },
    'caulfield-gardens': {
      bearing: 180,
      center: [-0.19684993, 51.5033856],
      zoom: 12.3
    },
    'telegraph': {
      bearing: 90,
      center: [-0.10669358, 51.51433123],
      zoom: 17.3,
      pitch: 40
    },
    'charing-cross': {
      bearing: 90,
      center: [-0.12416858, 51.50779757],
      zoom: 14.3,
      pitch: 20
    }
  };

  let activeChapterName = 'baker';

  function setActiveChapter(chapterName) {
    if (chapterName === activeChapterName) return;

    map.flyTo(chapters[chapterName]);

    document.getElementById(chapterName).classList.add('active');
    document.getElementById(activeChapterName).classList.remove('active');

    activeChapterName = chapterName;
  }

  function isElementOnScreen(id) {
    const element = document.getElementById(id);
    const bounds = element.getBoundingClientRect();
    return bounds.top < window.innerHeight && bounds.bottom > 0;
  }

  // On every scroll event, check which element is on screen
  window.onscroll = () => {
    for (const chapterName in chapters) {
      if (isElementOnScreen(chapterName)) {
        setActiveChapter(chapterName);
        break;
      }
    }
  };

</script>

</body>
</html>
